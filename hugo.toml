baseURL = "https://diflowrin.github.io/content-architect-blog/"
languageCode = "en"
defaultContentLanguage = "en"
locale = "en-US"
title = "SEO Content Architect Blog"
theme = "LoveIt"
timeZone = "Europe/Bucharest"
enableRobotsTXT = true
enableEmoji = true

[pagination]
pagerSize = 10

[minify]
disableXML = true

[params]
description = "Guides, comparisons, and tutorials on AI content creation, WordPress automation, and social media repurposing — from the makers of SEO Content Architect."
keywords = ["ai content generator for wordpress", "ai article writer", "wordpress content automation", "ai seo content", "content repurposing"]
images = []

[params.author]
name = "SEO Content Architect"

[params.app]
# Fără override, tema trimite `application-name = "My cool site"`.
title = "SEO Content Architect Blog"
# Nu există favicon.ico / apple-touch-icon / site.webmanifest în static/, iar
# tema le linka de la rădăcina domeniului (în afara subcăii) — șase referințe 404.
noFavicon = true

[params.header]
[params.header.title]
name = "SEO Content Architect"
pre = ""
post = ""

[params.footer]
enable = true
custom = ""
hugo = false
copyright = true
author = true
since = 2026
license = ""

[params.section]
# Toate articolele încap pe /posts/ într-o singură pagină; pagina 2 era o arhivă
# subțire (un singur articol), canonicalizată oricum către /posts/.
paginate = 20
dateFormat = "Jan 02"
rss = 10

[params.list]
paginate = 10
dateFormat = "Jan 02"
rss = 10

[params.home]
rss = 10

[params.home.profile]
enable = true
title = "SEO Content Architect Blog"
subtitle = "Guides, comparisons, and tutorials on AI content creation, WordPress automation, and social media repurposing."
typeit = true
social = true
disclaimer = "Build your own automated blog with <a href=\"https://diflowrin.com/seo-content-architect/\" target=\"_blank\" rel=\"noopener\">SEO Content Architect</a> — AI writing, images, and WordPress publishing on autopilot."

[params.home.posts]
enable = true
# Paginarea de 6 genera /page/2/ și /page/3/: pagini fără titlu sau descriere
# proprie (Hugo le canonicalizează oricum către „/"), pe care Bing le raporta
# drept meta descriptions duplicate. Aceeași soluție ca la [params.section].
paginate = 20

[params.social]
# Doar ID-ul: tema prefixează cu https://github.com/
Github = "diflowrin"

# Tema livrează `url = "/index.xml"`, iar `relLangURL` nu prefixează căile care
# încep cu `/` — pe un baseURL cu subcale ieșea un link mort către
# https://diflowrin.github.io/index.xml. Calea relativă primește prefixul corect.
[params.social.RSS]
url = "index.xml"

[params.page]
lightgallery = true

[params.page.toc]
enable = true
keepStatic = false
auto = true

[params.page.code]
copy = true
maxShownLines = 50

[params.page.share]
enable = true
Twitter = true
Facebook = true
Linkedin = true
Reddit = true
Telegram = true

[params.page.comment]
enable = false

# Tema livrează `params.page.seo.publisher.name = ""`, iar în head/seo.html acel
# gol se merge-uiește PESTE numele autorului — fiecare articol ieșea cu
# "publisher": {"@type": "Organization", "name": ""}, adică un publisher invalid
# în datele structurate. Îl declarăm explicit aici.
[params.page.seo.publisher]
name = "SEO Content Architect"

[params.typeit]
speed = 100
pauseDelay = 1500

[params.search]
enable = true
type = "lunr"
contentLength = 4000
placeholder = ""
maxResultLength = 10
snippetLength = 30
highlightTag = "em"
useHugoContentLength = false

[menu]
[[menu.main]]
identifier = "posts"
pre = ""
post = ""
name = "Articles"
url = "/posts/"
weight = 1
[[menu.main]]
identifier = "tags"
pre = ""
post = ""
name = "Tags"
url = "/tags/"
weight = 2
[[menu.main]]
identifier = "website"
pre = ""
post = ""
name = "Website"
url = "https://diflowrin.com/seo-content-architect/"
weight = 3

# Niciun articol nu folosește `categories`, dar Hugo genera oricum /categories/:
# o arhivă goală, cu descriere proprie și og:description luat din descrierea
# site-ului. Declarând doar `tag`, pagina dispare cu totul.
[taxonomies]
tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = true
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputs]
home = ["HTML", "RSS", "JSON"]
